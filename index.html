<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Learning</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .video-player {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Lapisan khusus tombol; terpisah dari styling pemutar video. */
        .start-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            padding-left: 750px;
            padding-top: 350px;
            box-sizing: border-box;
            color: #fff;
            font: 24px sans-serif;
        }

        .start-overlay.visible {
            display: flex;
            animation: overlay-fade-in 500ms ease-out both;
        }

        .start-button {
            width: 490px;
            height: 200px;
            margin-left: 130px;
            margin-bottom: 110px;
            color: transparent;
            background: url('./1/mulai.png') center/contain no-repeat;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            animation: start-button-enter 600ms 150ms ease-out both;
        }

        .start-button:hover {
            transform: scale(1.03);
            filter: brightness(1.08);
        }

        @keyframes overlay-fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes start-button-enter {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.94);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="video-wrapper">
        <video id="video" class="video-player" controls autoplay>
            <source src="./1/video.mp4" type="video/mp4">
        </video>

        <div class="start-overlay" id="videoOverlay">
            <button id="nextButton" class="start-button" type="button"></button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const videoSource = video.querySelector('source');
        const videoOverlay = document.getElementById('videoOverlay');
        const nextButton = document.getElementById('nextButton');

        video.addEventListener('ended', () => {
            videoOverlay.classList.add('visible');
        });

        nextButton.addEventListener('click', () => {
            videoSource.src = './2/video.mp4';
            videoOverlay.classList.remove('visible');
            video.load();
            video.play();
        });
    </script>
</body>
</html>
