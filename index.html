<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Learning</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .video-player {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .start-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .start-overlay.visible {
            display: flex;
        }

        .start-button {
            width: 500px;
            height: 150px;
            margin-top: 230px;
            margin-left:880px;
            color: transparent;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-color: transparent;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('./1/mulai.png');
            opacity:0;
        }

        .apple-button {
            display: none;
            flex-shrink: 0;
            position: absolute;
            left: 910px;
            top: 270px;
            width: 440px;
            height: 150px;
            color: transparent;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-color: white;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('./2/apel.png');
            opacity: 0;
        }

        .orange-button {
            display: none;
            flex-shrink: 0;
            position: absolute;
            width: 420px;
            height: 150px;
            left: 920px;
            top: 460px;
            color: transparent;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-color: white;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('./2/jeruk.png');
            opacity: 0;
        }

        /* Setelah video kedua, hanya pilihan Apel dan Jeruk yang ditampilkan. */
        .start-overlay.choice-mode {
            flex-direction: row;
        }

        .start-overlay.choice-mode .start-button {
            display: none;
        }

        .start-overlay.choice-mode .apple-button,
        .start-overlay.choice-mode .orange-button {
            display: block;
        }

        .orange-audio {
            display: none;
            position: absolute;
            bottom: 32px;
            width: min(90vw, 360px);
        }

        .orange-audio.visible {
            display: block;
        }

    </style>
</head>
<body>
    <div class="video-wrapper">
        <video id="video" class="video-player" controls autoplay playsinline>
            <source src="./1/video.mp4" type="video/mp4">
        </video>

        <div class="start-overlay" id="videoOverlay">
            <button id="nextButton" class="start-button" type="button"></button>
            <button id="appleButton" class="apple-button" type="button"></button>
            <button id="orangeButton" class="orange-button" type="button"></button>
            <audio id="orangeAudio" class="orange-audio" controls>
                <source src="./2/jeruk.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const videoSource = video.querySelector('source');
        const videoOverlay = document.getElementById('videoOverlay');
        const nextButton = document.getElementById('nextButton');
        const appleButton = document.getElementById('appleButton');
        const orangeButton = document.getElementById('orangeButton');
        const orangeAudio = document.getElementById('orangeAudio');
        let videoSaatIni = 1;

        video.addEventListener('ended', () => {
            if (videoSaatIni === 1) {
                videoOverlay.classList.remove('choice-mode');
                videoOverlay.classList.add('visible');
            } else if (videoSaatIni === 2) {
                videoOverlay.classList.add('choice-mode', 'visible');
            }
        });

        nextButton.addEventListener('click', () => {
            if (videoSaatIni === 1) {
                videoSource.src = './2/video.mp4';
                videoSaatIni = 2;
            }

            videoOverlay.classList.remove('visible');
            video.load();
            video.play();
        });

        appleButton.addEventListener('click', () => {
            videoSource.src = './3/video.mp4';
            videoSaatIni = 3;
            videoOverlay.classList.remove('choice-mode', 'visible');
            video.load();
            video.play();
        });

        orangeButton.addEventListener('click', () => {
            orangeAudio.classList.add('visible');
            orangeAudio.play();
        });
    </script>
</body>
</html>
