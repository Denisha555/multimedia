<body>
    <div id="tapToStart" style="
        position: fixed; inset: 0; z-index: 999;
        background: rgba(0, 0, 0, 0.55);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
    ">
        <div id="startPlayButton" style="
            width: clamp(70px, 18vw, 120px);
            height: clamp(70px, 18vw, 120px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.25);
            display: flex; align-items: center; justify-content: center;
            animation: startPulse 1.6s ease-in-out infinite;
        ">
            <div style="
                width: 0; height: 0;
                border-top: clamp(14px, 4vw, 24px) solid transparent;
                border-bottom: clamp(14px, 4vw, 24px) solid transparent;
                border-left: clamp(22px, 6vw, 38px) solid rgb(127, 127, 128);
                margin-left: 6px;
            "></div>
        </div>
        <style>
            @keyframes startPulse {
                0%, 100% { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.25); }
                50% { box-shadow: 0 0 0 16px rgba(255, 255, 255, 0.1); }
            }
        </style>
    </div>

    <div class="video-wrapper" id="videoWrapper">
        <div class="youtube-player-container" id="youtubePlayerContainer">
            <div id="youtubePlayer"></div>
        </div>
        <video id="video" class="video-player" playsinline webkit-playsinline disablePictureInPicture controlsList="nodownload noplaybackrate" style="display: none;">
            <source src="./opening/video.mp4" type="video/mp4">
        </video>

        <div class="video-area" id="videoArea">
            <div class="start-overlay" id="videoOverlay">
                <div id="openingNext" class="opening-next">
                    <div class="navigation-control-indicator" style="
                        border-radius: 50%;
                        background: rgba(10, 25, 45, 0.88);
                        box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.25);
                        display: flex; align-items: center; justify-content: center;
                        animation: nextPulse 1.6s ease-in-out infinite;
                    ">
                        <div style="
                            width: 0; height: 0;
                            border-top: clamp(8px, 1.5vw, 12px) solid transparent;
                            border-bottom: clamp(8px, 1.5vw, 12px) solid transparent;
                            border-left: clamp(12px, 1.8vw, 16px) solid rgb(255, 255, 255);
                            margin-left: 5px;
                        "></div>
                    </div>
                    <style>
                        @keyframes nextPulse {
                            0%, 100% { box-shadow: 0 0 0 4px rgba(10, 25, 45, 0.50); }
                            50% { box-shadow: 0 0 0 8px rgba(10, 25, 45, 0.1); }
                        }
                    </style>
                </div>

                <div id="openingTryAgain" class="opening-try-again">
                    <div class="navigation-control-indicator" style="
                        border-radius: 50%;
                        background: rgba(10, 25, 45, 0.88);
                        box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.25);
                        display: flex; align-items: center; justify-content: center;
                        animation: tryAgaintPulse 1.6s ease-in-out infinite;
                    ">
                        <svg class="navigation-control-icon"
                            viewBox="0 0 32 32"
                            fill="none"
                            stroke="white"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round">

                            <!-- M4 5	Pindah ke koordinat (4, 5) -->
                            <!-- V12	Gambar garis vertikal ke y = 12 -->
                            <!-- H11	Gambar garis horizontal ke x = 11 -->
                            <!-- L      Gambar garis -->
                            <!-- A	Menggambar busur
                                10	Radius horizontal (rx) = 10
                                10	Radius vertikal (ry) = 10
                                0	Rotasi elips = 0°
                                0	large-arc-flag = 0, memilih busur kecil
                                0	sweep-flag = 0, menentukan arah busur
                                25 24	Koordinat tujuan (x = 25, y = 24) -->
                            <path d="M25 12A10 10 0 0 0 7 8L4 12"/>
                            <path d="M4 5V12H11"/>
                            <path d="M7 20A10 10 0 0 0 23 23L25 20"/>
                        </svg>
                    </div>
                    <style>
                        @keyframes tryAgaintPulse {
                            0%, 100% { box-shadow: 0 0 0 4px rgba(10, 25, 45, 0.50); }
                            50% { box-shadow: 0 0 0 8px rgba(10, 25, 45, 0.1); }
                        }
                    </style>
                </div>

                <div id="openingPreviouse" class="opening-previouse">
                    <div class="navigation-control-indicator" style="
                        border-radius: 50%;
                        background: rgba(10, 25, 45, 0.88);
                        box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.25);
                        display: flex; align-items: center; justify-content: center;
                        animation: previuousetPulse 1.6s ease-in-out infinite;
                    ">
                        <div style="
                            width: 0; height: 0;
                            border-top: clamp(8px, 1.5vw, 12px) solid transparent;
                            border-bottom: clamp(8px, 1.5vw, 12px) solid transparent;
                            border-right: clamp(12px, 1.8vw, 16px) solid rgb(255, 255, 255);
                            margin-right: 5px;
                        "></div>
                    </div>
                    <style>
                        @keyframes previuousetPulse {
                            0%, 100% { box-shadow: 0 0 0 4px rgba(10, 25, 45, 0.50); }
                            50% { box-shadow: 0 0 0 8px rgba(10, 25, 45, 0.1); }
                        }
                    </style>
                </div>

                <audio id="backgroundAudio" class="background-audio" loop>
                    <source src="background_audio.mp3" type="audio/mpeg">
                </audio>
                
                <audio id="trueAudio" class="true-audio">
                    <source src="true_audio.mp3" type="audio/mpeg">
                </audio>
                <audio id="falseAudio" class="false-audio">

    <script>
        const tapToStart = document.getElementById('tapToStart');

        const orangeDropZone = document.getElementById('orangeDropZone');
  
        const quiz1button1 = document.getElementById('quiz1button1');
        const quiz1button2 = document.getElementById('quiz1button2');
        const quiz1button3 = document.getElementById('quiz1button3');
        const quiz1button4 = document.getElementById('quiz1button4');

        const quiz2button1 = document.getElementById('quiz2button1');
        const quiz2button2 = document.getElementById('quiz2button2');
        const quiz2button3 = document.getElementById('quiz2button3');
        const quiz2button4 = document.getElementById('quiz2button4');

        // ===== BUTTONS =====
        let videoSaatIni = 0;
        let youtubePlayer = null;
        let youtubeReady = false;
        let youtubeActive = true;
        let youtubeStartRequested = false;
        let youtubeStartAtEnd = false;

        function startYoutubePlayback() {
            if (!youtubeReady) return;

            if (youtubeStartAtEnd) {
                const duration = youtubePlayer.getDuration();
                if (duration > 0) youtubePlayer.seekTo(Math.max(0, duration - 0.1), true);
            } else {
                youtubePlayer.seekTo(0, true);
            }

            youtubeStartRequested = false;
            youtubeStartAtEnd = false;
            youtubePlayer.playVideo();
        }

        function playYoutubeOpening(startAtEnd = false) {
            youtubeActive = true;
            video.pause();
            video.style.display = 'none';
            youtubePlayerContainer.style.display = 'block';
            updateVideoArea();

            youtubeStartRequested = true;
            youtubeStartAtEnd = startAtEnd;
            startYoutubePlayback();
        }

        function playLocalVideo(source, scene) {
            youtubeActive = false;
            youtubeStartRequested = false;
            if (youtubeReady) youtubePlayer.pauseVideo();
            youtubePlayerContainer.style.display = 'none';
            video.style.display = 'block';
            videoSource.src = source;
            videoSaatIni = scene;
            video.load();
            video.play().catch((err) => {
                console.error('Video gagal diputar:', err);
            });
        }

        window.onYouTubeIframeAPIReady = () => {
            youtubePlayer = new YT.Player('youtubePlayer', {
                videoId: '4c8UxkUBqTg',
                playerVars: {
                    playsinline: 1,
                    controls: 1,
                    rel: 0
                },
                events: {
                    onReady: () => {
                        youtubeReady = true;
                        updateVideoArea();
                        startYoutubePlayback();
                    },
                    onStateChange: (event) => {
                        if (event.data === YT.PlayerState.ENDED && youtubeActive) {
                            handleVideoEnded();
                        }
                    },
                    onError: (event) => {
                        console.error('Video YouTube gagal dimuat. Kode:', event.data);
                    }
                }
            });
        };

        const youtubeApiScript = document.createElement('script');
        youtubeApiScript.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(youtubeApiScript);

        // ===== DRAG AND DROP =====
        function makeDraggable(el, targetZone, onCorrectDrop, onWrongDrop) {
            let offsetX = 0, offsetY = 0, isDragging = false;
            let startLeft = '', startTop = '';

            el.addEventListener('pointerdown', (e) => {
                isDragging = true;
                el.classList.add('dragging');
                el.classList.remove('snap-back');
                el.setPointerCapture(e.pointerId);

                const areaRect = videoArea.getBoundingClientRect();
                const rect = el.getBoundingClientRect();
                startLeft = (rect.left - areaRect.left) + 'px';
                startTop = (rect.top - areaRect.top) + 'px';

                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;

                el.style.position = 'absolute';
                el.style.left = startLeft;
                el.style.top = startTop;
                el.style.right = 'auto';
            });

            el.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const areaRect = videoArea.getBoundingClientRect();
                let newLeft = e.clientX - areaRect.left - offsetX;
                let newTop = e.clientY - areaRect.top - offsetY;
                el.style.left = newLeft + 'px';
                el.style.top = newTop + 'px';
            });

            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                el.classList.remove('dragging');
                el.releasePointerCapture(e.pointerId);
                checkDropZone(el, targetZone, onCorrectDrop, onWrongDrop, startLeft, startTop);
            }

            el.addEventListener('pointerup', endDrag);
            el.addEventListener('pointercancel', endDrag);
        }

        function checkDropZone(el, targetZone, onCorrectDrop, onWrongDrop, startLeft, startTop) {
            const elRect = el.getBoundingClientRect();
            const zoneRect = targetZone.getBoundingClientRect();
            const tolerance = 10; 

            const fullyInside =
                elRect.left   >= zoneRect.left   - tolerance &&
                elRect.right  <= zoneRect.right  + tolerance &&
                elRect.top    >= zoneRect.top    - tolerance &&
                elRect.bottom <= zoneRect.bottom + tolerance;

            if (fullyInside) {
                snapToCenter(el, targetZone);
                if (onCorrectDrop) onCorrectDrop();
            } else {
                el.classList.add('snap-back');
                falseAudio.play();
                el.style.left = startLeft;
                el.style.top = startTop;
                if (onWrongDrop) onWrongDrop();
            }
        }

        function snapToCenter(el, targetZone) {
            const areaRect = videoArea.getBoundingClientRect();
            const zoneRect = targetZone.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();

            const zoneCenterX = zoneRect.left - areaRect.left + zoneRect.width / 2;
            const zoneCenterY = zoneRect.top - areaRect.top + zoneRect.height / 2;

            const newLeft = zoneCenterX - elRect.width / 2;
            const newTop = zoneCenterY - elRect.height / 2;

            el.classList.add('snap-back');
            el.style.left = newLeft + 'px';
            el.style.top = newTop + 'px';
        }

        let appleCorrect = false;
        let orangeCorrect = false;

        function checkBothCorrect() {
            if (appleCorrect && orangeCorrect) {
                videoOverlay.classList.remove('choice-mode-4', 'visible');
                playLocalVideo('./5/video.mp4', 5);
            }
        }

        makeDraggable(appleButton3, appleDropZone,
            () => { trueAudio.play(); appleCorrect = true; checkBothCorrect(); },
            () => { appleCorrect = false; }
        );
        makeDraggable(orangeButton3, orangeDropZone,
            () => { trueAudio.play(); orangeCorrect = true; checkBothCorrect(); },
            () => { orangeCorrect = false; }
        );

        function updateVideoArea() {
            const videoRatio = youtubeActive
                ? 16 / 9
                : video.videoWidth && video.videoHeight
                    ? video.videoWidth / video.videoHeight
                    : 0;
            if (!videoRatio) return;

            const cw = videoWrapper.clientWidth;
            const ch = videoWrapper.clientHeight;

            const containerRatio = cw / ch;

            let renderWidth, renderHeight, offsetX, offsetY;

            if (containerRatio > videoRatio) {
                renderHeight = ch;
                renderWidth = ch * videoRatio;
                offsetX = (cw - renderWidth) / 2;
                offsetY = 0;
            } else {
                renderWidth = cw;
                renderHeight = cw / videoRatio;
                offsetX = 0;
                offsetY = (ch - renderHeight) / 2;
            }

            videoArea.style.left = offsetX + 'px';
            videoArea.style.top = offsetY + 'px';
            videoArea.style.width = renderWidth + 'px';
            videoArea.style.height = renderHeight + 'px';
            youtubePlayerContainer.style.left = offsetX + 'px';
            youtubePlayerContainer.style.top = offsetY + 'px';
            youtubePlayerContainer.style.width = renderWidth + 'px';
            youtubePlayerContainer.style.height = renderHeight + 'px';

            if (youtubeReady && youtubeActive) {
                youtubePlayer.setSize(renderWidth, renderHeight);
            }
        }

        video.addEventListener('loadedmetadata', updateVideoArea);
        window.addEventListener('resize', updateVideoArea);
        window.addEventListener('orientationchange', updateVideoArea);
        updateVideoArea();

        tapToStart.addEventListener('click', () => {
            tapToStart.style.display = 'none';
            playYoutubeOpening();
            backgroundAudio.play().catch((err) => {
                console.error('Audio latar gagal diputar:', err);
            });
        }, { once: true });

        function handleVideoEnded() {
            if (videoSaatIni === 0) {
                videoOverlay.classList.remove('choice-mode-01', 'choice-mode-02', 'choice-mode-03', 'choice-mode-04', 'choice-mode-05',  'choice-mode-10', 'choice-mode-11', 'choice-mode-12', 'choice-mode-2', 'choice-mode-3', 'choice-mode-4', 'choice-mode-5', 'choice-mode-51', 'choice-mode-6', 'choice-mode-61');
                videoOverlay.classList.add('choice-mode-01', 'choice-mode-02', 'choice-mode-03', 'choice-mode-04', 'choice-mode-05', 'visible');
            } else if (videoSaatIni === 0.1) {
                videoOverlay.classList.add('choice-mode-10', 'choice-mode-11', 'choice-mode-12', 'visible');
            } else if (videoSaatIni === 1) {
                videoOverlay.classList.remove('choice-mode', 'choice-mode-01', 'choice-mode-02', 'choice-mode-03', 'choice-mode-04', 'choice-mode-05',  'choice-mode-10', 'choice-mode-11', 'choice-mode-12', 'choice-mode-2', 'choice-mode-3', 'choice-mode-4', 'choice-mode-5', 'choice-mode-51', 'choice-mode-6', 'choice-mode-61');
                videoOverlay.classList.add('choice-mode', 'visible');
            } else if (videoSaatIni === 2) {
                videoOverlay.classList.add('choice-mode-2', 'visible');
            } else if (videoSaatIni === 3) {
                videoOverlay.classList.add('choice-mode-3', 'visible');
            } else if (videoSaatIni === 4) {
                videoOverlay.classList.add('choice-mode-4', 'visible');
            } else if (videoSaatIni === 5) {
                playLocalVideo('./6/video.mp4', 6);
            } else if (videoSaatIni === 6) {
                videoOverlay.classList.add('choice-mode-5', 'visible');
            } else if (videoSaatIni === 7) {
                videoOverlay.classList.add('choice-mode-6', 'visible');
            }
        }

        video.addEventListener('ended', handleVideoEnded);

        kesehatanButton.addEventListener('click', () => {
            videoOverlay.classList.remove('choice-mode-01', 'choice-mode-02', 'choice-mode-03', 'choice-mode-04', 'choice-mode-05');

        openingTryAgain.addEventListener('click', () => {

                playYoutubeOpening();

                video.currentTime = 0;
                video.play().catch((err) => {
                    console.error('Video gagal diputar:', err);

        openingPreviouse.addEventListener('click', () => {
            videoSaatIni = 0;
            videoOverlay.classList.remove(
                'choice-mode-01', 'choice-mode-02', 'choice-mode-03', 'choice-mode-04', 'choice-mode-05', 'choice-mode-10',

            playYoutubeOpening(true);
        })

        nextButton.addEventListener('click', () => {

        appleButton.addEventListener('click', () => {

        quiz2button1.addEventListener('click', () => {

        quiz2button2.addEventListener('click', () => {
            falseAudio.play();

        quiz2button3.addEventListener('click', () => {
