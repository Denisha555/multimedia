<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Learning</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .video-player {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* videoArea = area video yang BENAR-BENAR tampil di layar
           (sudah memperhitungkan letterbox/pillarbox dari object-fit:contain).
           Semua tombol diposisikan relatif terhadap div ini, bukan terhadap
           seluruh layar, jadi persen posisinya konsisten di HP maupun laptop. */
        .video-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .start-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .start-overlay.visible {
            display: flex;
        }

        .start-button {
            width: 26%;
            height: 15%;
            position: absolute;
            top: 60.5%;
            left: 50.5%;
            color: white;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-color: white;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('./1/mulai.png');
            opacity: 0;
        }

        .apple-button {
            display: none;
            flex-shrink: 0;
            position: absolute;
            left: 55%;
            top: 35%;
            width: 31%;
            height: 18%;
            color: white;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-color: white;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('./2/apel.png');
            opacity: 0;
        }

        .orange-button {
            display: none;
            flex-shrink: 0;
            position: absolute;
            width: 31%;
            height: 18%;
            left: 55%;
            top: 59%;
            color: white;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-color: white;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('./2/jeruk.png');
            /* opacity: 0; */
        }

        .apple-button2 {
            display: none;
            flex-shrink: 0;
            position: absolute;
            left: 61%;
            top: 44%;
            width: 31%;
            height: 18%;
            color: white;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-color: white;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('./3/apel.png');
            opacity: 0;
        }

        .orange-button2 {
            display: none;
            flex-shrink: 0;
            position: absolute;
            width: 31%;
            height: 18%;
            left: 61%;
            top: 66%;
            color: white;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-color: white;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('./3/jeruk.png');
            /* opacity: 0; */
        }

        .start-overlay.choice-mode {
            flex-direction: row;
        }

        .start-overlay.choice-mode .start-button {
            display: none;
        }

        .start-overlay.choice-mode .apple-button,
        .start-overlay.choice-mode .orange-button {
            display: block;
        }

        .start-overlay.choice-mode-3 .apple-button2,
        .start-overlay.choice-mode-3 .orange-button2 {
            display: block;
        }

        .orange-audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="video-wrapper" id="videoWrapper">
        <video id="video" class="video-player" controls autoplay playsinline>
            <source src="./1/video.mp4" type="video/mp4">
        </video>

        <!-- videoArea dihitung ulang lewat JS supaya ukuran & posisinya
             persis menutupi gambar video yang tampil (bukan seluruh layar) -->
        <div class="video-area" id="videoArea">
            <div class="start-overlay" id="videoOverlay">
                <button id="nextButton" class="start-button" type="button"></button>
                <button id="appleButton" class="apple-button" type="button"></button>
                <button id="orangeButton" class="orange-button" type="button"></button>
                <button id="appleButton2" class="apple-button2" type="button"></button>
                <button id="orangeButton2" class="orange-button2" type="button"></button>
                <audio id="orangeAudio" class="orange-audio">
                    <source src="./2/audio.mp3" type="audio/mpeg">
                </audio>
                <audio id="appleAudio" class="apple-audio">
                    <source src="./3/audio.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const videoSource = video.querySelector('source');
        const videoWrapper = document.getElementById('videoWrapper');
        const videoArea = document.getElementById('videoArea');
        const videoOverlay = document.getElementById('videoOverlay');
        const nextButton = document.getElementById('nextButton');
        const appleButton = document.getElementById('appleButton');
        const orangeButton = document.getElementById('orangeButton');
        const appleButton2 = document.getElementById('appleButton2');
        const orangeButton2 = document.getElementById('orangeButton2');
        const orangeAudio = document.getElementById('orangeAudio');
        const appleAudio = document.getElementById('appleAudio');
        let videoSaatIni = 1;

        // Menghitung ulang posisi & ukuran videoArea supaya PERSIS
        // menutupi area video yang tampil di layar (efek object-fit: contain
        // dihitung manual di sini), lalu overlay tombol mengikuti area ini.
        function updateVideoArea() {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            if (!vw || !vh) return; // metadata video belum siap

            const cw = videoWrapper.clientWidth;
            const ch = videoWrapper.clientHeight;

            const videoRatio = vw / vh;
            const containerRatio = cw / ch;

            let renderWidth, renderHeight, offsetX, offsetY;

            if (containerRatio > videoRatio) {
                // Layar lebih "lebar" dari video -> ada bar hitam kiri-kanan
                renderHeight = ch;
                renderWidth = ch * videoRatio;
                offsetX = (cw - renderWidth) / 2;
                offsetY = 0;
            } else {
                // Layar lebih "tinggi/kurus" dari video -> ada bar hitam atas-bawah
                renderWidth = cw;
                renderHeight = cw / videoRatio;
                offsetX = 0;
                offsetY = (ch - renderHeight) / 2;
            }

            videoArea.style.left = offsetX + 'px';
            videoArea.style.top = offsetY + 'px';
            videoArea.style.width = renderWidth + 'px';
            videoArea.style.height = renderHeight + 'px';
        }

        video.addEventListener('loadedmetadata', updateVideoArea);
        window.addEventListener('resize', updateVideoArea);
        window.addEventListener('orientationchange', updateVideoArea);
        // Jaga-jaga kalau metadata sudah ready duluan sebelum listener terpasang
        updateVideoArea();

        video.addEventListener('ended', () => {
            if (videoSaatIni === 1) {
                videoOverlay.classList.remove('choice-mode', 'choice-mode-3');
                videoOverlay.classList.add('visible');
            } else if (videoSaatIni === 2) {
                videoOverlay.classList.add('choice-mode', 'visible');
            } else if (videoSaatIni === 3) {
                videoOverlay.classList.add('choice-mode-3', 'visible');
            }
        });

        nextButton.addEventListener('click', () => {
            if (videoSaatIni === 1) {
                videoSource.src = './2/video.mp4';
                videoSaatIni = 2;
            }

            videoOverlay.classList.remove('visible');
            video.load();
            video.play();
        });

        appleButton.addEventListener('click', () => {
            videoSource.src = './3/video.mp4';
            videoSaatIni = 3;
            videoOverlay.classList.remove('choice-mode', 'choice-mode-3', 'visible');
            video.load();
            video.play();
        });

        orangeButton.addEventListener('click', () => {
            orangeAudio.play();
        });

        orangeButton2.addEventListener('click', () => {
            videoSource.src = './4/video.mp4';
            videoSaatIni = 4;
            videoOverlay.classList.remove('choice-mode', 'choice-mode-3', 'visible');
            video.load();
            video.play();
        });

        appleButton2.addEventListener('click', () => {
            appleAudio.play();
        });
    </script>
</body>
</html>
