<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Learning</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        video {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            padding-left: 750px;
            padding-top: 350px;
            box-sizing: border-box;
            color: #fff;
            font: 24px sans-serif;
        }

        .video-overlay.visible {
            display: flex;
            animation: overlay-fade-in 500ms ease-out both;
        }

        .video-overlay button {
            padding: 10px 18px;
            color: #fff;
            background: #2563eb;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            animation: start-button-enter 600ms 150ms ease-out both;
        }

        @keyframes overlay-fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes start-button-enter {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.94);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="video-wrapper">
        <video id="video" controls autoplay>
            <source src="./1/video.mp4" type="video/mp4">
        </video>

        <div id="videoOverlay" class="video-overlay">
            <button id="nextButton" type="button">Start</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const videoSource = video.querySelector('source');
        const videoOverlay = document.getElementById('videoOverlay');
        const nextButton = document.getElementById('nextButton');

        video.addEventListener('ended', () => {
            videoOverlay.classList.add('visible');
        });

        nextButton.addEventListener('click', () => {
            videoSource.src = './1/video.mp4';
            videoOverlay.classList.remove('visible');
            video.load();
            video.play();
        });
    </script>
</body>
</html>
